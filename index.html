<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Photo Spin Quest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1015;
      --card: #1b1c24;
      --accent: #ff4757;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .top-bar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .level-badge { background: #2f3542; padding: 6px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; }
    .spins-badge { background: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }

    .tile-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }

    .tile {
      aspect-ratio: 1;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile img { width: 100%; height: 100%; object-fit: cover; filter: blur(12px) grayscale(100%); transition: filter 0.4s ease; }
    .tile.unlocked img { filter: none; }
    .tile.active-highlight { border-color: #ffd32a; transform: scale(1.06); box-shadow: 0 0 16px #ffd32a; }

    .btn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-spin { background: #2ed573; color: #000; }
    .btn-ad { background: #ffa502; color: #000; display: none; }

    /* Modal for Photo Reveal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal img { width: 100%; max-width: 320px; aspect-ratio: 1; object-fit: cover; border-radius: 14px; margin-bottom: 16px; border: 2px solid #fff; }
    .modal h3 { margin-bottom: 16px; }
    .modal-btn { background: #fff; color: #000; padding: 10px 24px; border-radius: 20px; font-weight: bold; border: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="level-badge">Level 1: Street View</div>
    <div class="spins-badge">Spins: <span id="spin-count">3</span></div>
  </div>

  <div class="tile-board" id="board"></div>

  <button id="btn-action" class="btn btn-spin">SPIN THE TILES</button>

  <!-- Reveal Modal -->
  <div class="modal" id="reveal-modal">
    <h3 id="reveal-title">Photo Unlocked!</h3>
    <img id="reveal-img" src="" alt="Revealed Photo" />
    <button class="modal-btn" id="modal-close-btn">Collect & Continue</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const levelTiles = [
      { id: 1, title: "Urban Highway", url: "https://picsum.photos/id/10/500/500", unlocked: false },
      { id: 2, title: "Vintage Alley", url: "https://picsum.photos/id/20/500/500", unlocked: false },
      { id: 3, title: "Rainy Evening", url: "https://picsum.photos/id/30/500/500", unlocked: false },
      { id: 4, title: "Shadows in Motion", url: "https://picsum.photos/id/40/500/500", unlocked: false },
      { id: 5, title: "Underground Route", url: "https://picsum.photos/id/50/500/500", unlocked: false },
      { id: 6, title: "Golden Hour Glow", url: "https://picsum.photos/id/60/500/500", unlocked: false }
    ];

    let spins = 3;
    let isSpinning = false;

    const boardEl = document.getElementById('board');
    const spinCountEl = document.getElementById('spin-count');
    const btnAction = document.getElementById('btn-action');
    const modal = document.getElementById('reveal-modal');
    const revealImg = document.getElementById('reveal-img');
    const revealTitle = document.getElementById('reveal-title');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function renderBoard() {
      boardEl.innerHTML = '';
      levelTiles.forEach((tile, index) => {
        const div = document.createElement('div');
        div.className = `tile ${tile.unlocked ? 'unlocked' : ''}`;
        div.id = `tile-${index}`;
        div.innerHTML = `<img src="${tile.url}" alt="${tile.title}" />`;
        boardEl.appendChild(div);
      });
    }

    function updateControls() {
      spinCountEl.textContent = spins;
      if (spins > 0) {
        btnAction.style.display = 'block';
        btnAction.className = 'btn btn-spin';
        btnAction.textContent = `SPIN (Remaining: ${spins})`;
      } else {
        btnAction.style.display = 'block';
        btnAction.className = 'btn btn-ad';
        btnAction.textContent = 'Watch Ad to get +1 Spin';
      }
    }

    btnAction.addEventListener('click', () => {
      if (isSpinning) return;
      if (spins > 0) {
        runTileSpin();
      } else {
        triggerSimulatedAd();
      }
    });

    function runTileSpin() {
      isSpinning = true;
      spins--;
      updateControls();

      let currentIndex = 0;
      let speed = 60;
      let totalSteps = 20 + Math.floor(Math.random() * 8);
      let step = 0;

      function highlightStep() {
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('active-highlight'));
        const activeTileEl = document.getElementById(`tile-${currentIndex % levelTiles.length}`);
        if (activeTileEl) activeTileEl.classList.add('active-highlight');

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        step++;
        currentIndex++;

        if (step < totalSteps) {
          if (step > totalSteps - 6) speed += 35;
          setTimeout(highlightStep, speed);
        } else {
          finishSpin(currentIndex % levelTiles.length);
        }
      }

      highlightStep();
    }

    function finishSpin(landedIndex) {
      isSpinning = false;
      const wonTile = levelTiles[landedIndex];
      wonTile.unlocked = true;
      renderBoard();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      // Pop up the full-screen photo reward
      revealTitle.textContent = `Unlocked: ${wonTile.title}`;
      revealImg.src = wonTile.url;
      modal.classList.add('active');
      updateControls();
    }

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function triggerSimulatedAd() {
      alert("Simulating Ad View... (In next step, this connects to AdsGram)");
      spins += 1;
      updateControls();
    }

    renderBoard();
    updateControls();
  </script>
</body>
</html>
