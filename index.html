<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Photo Spin Quest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1015;
      --card: #1b1c24;
      --accent: #ff4757;
      --text: #ffffff;
      --gold: #ffd32a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .top-bar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .level-badge { background: #2f3542; padding: 6px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; }
    .spins-badge { background: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }

    .level-progress-bar {
      width: 100%; max-width: 360px; height: 6px; background: #2f3542; border-radius: 4px; margin-bottom: 16px; overflow: hidden;
    }
    .level-progress-fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.3s ease; }

    .tile-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 20px;
    }

    .tile {
      aspect-ratio: 1;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile img { width: 100%; height: 100%; object-fit: cover; filter: blur(14px) grayscale(100%); transition: filter 0.4s ease; }
    .tile.unlocked img { filter: none; }
    .tile.active-highlight { border-color: var(--gold); transform: scale(1.06); box-shadow: 0 0 16px var(--gold); }

    .btn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-spin { background: #2ed573; color: #000; }
    .btn-ad { background: #ffa502; color: #000; }

    /* Modal for Photo Reveal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal img { width: 100%; max-width: 320px; aspect-ratio: 1; object-fit: cover; border-radius: 14px; margin-bottom: 16px; border: 2px solid #fff; }
    .modal h3 { margin-bottom: 6px; text-align: center; }
    .modal p { color: #aaa; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
    .modal-btn { background: #fff; color: #000; padding: 12px 28px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="level-badge" id="level-title">Level 1</div>
    <div class="spins-badge">Spins: <span id="spin-count">3</span></div>
  </div>

  <div class="level-progress-bar">
    <div class="level-progress-fill" id="progress-fill"></div>
  </div>

  <div class="tile-board" id="board"></div>

  <button id="btn-action" class="btn btn-spin">SPIN THE TILES</button>

  <!-- Reveal Modal -->
  <div class="modal" id="reveal-modal">
    <h3 id="reveal-title">Photo Unlocked!</h3>
    <p id="reveal-sub">Added to your permanent collection</p>
    <img id="reveal-img" src="" alt="Revealed Photo" />
    <button class="modal-btn" id="modal-close-btn">Collect & Continue</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Level Packs Data
    const gameLevels = [
      {
        levelNumber: 1,
        theme: "Level 1: Urban Streets",
        tiles: [
          { id: 101, title: "Urban Highway", url: "https://picsum.photos/id/10/500/500" },
          { id: 102, title: "Vintage Alley", url: "https://picsum.photos/id/20/500/500" },
          { id: 103, title: "Rainy Evening", url: "https://picsum.photos/id/30/500/500" },
          { id: 104, title: "Shadows in Motion", url: "https://picsum.photos/id/40/500/500" },
          { id: 105, title: "Underground Route", url: "https://picsum.photos/id/50/500/500" },
          { id: 106, title: "Golden Hour Glow", url: "https://picsum.photos/id/60/500/500" }
        ]
      },
      {
        levelNumber: 2,
        theme: "Level 2: Wild Horizons",
        tiles: [
          { id: 201, title: "Mountain Fog", url: "https://picsum.photos/id/70/500/500" },
          { id: 202, title: "River Bend", url: "https://picsum.photos/id/80/500/500" },
          { id: 203, title: "Pine Shadows", url: "https://picsum.photos/id/90/500/500" },
          { id: 204, title: "Lakeside Camp", url: "https://picsum.photos/id/100/500/500" },
          { id: 205, title: "Rocky Crest", url: "https://picsum.photos/id/110/500/500" },
          { id: 206, title: "Deep Forest Path", url: "https://picsum.photos/id/120/500/500" }
        ]
      }
    ];

    // Local Storage State Management
    let currentLevelIndex = parseInt(localStorage.getItem('tma_level_idx') || '0');
    let spins = parseInt(localStorage.getItem('tma_spins') ?? '3');
    let unlockedTileIds = new Set(JSON.parse(localStorage.getItem('tma_unlocked_ids') || '[]'));
    let lastDailyReset = parseInt(localStorage.getItem('tma_last_reset') || '0');
    let isSpinning = false;

    // Daily Reset Check (24 Hours = 86400000 ms)
    const now = Date.now();
    if (now - lastDailyReset > 24 * 60 * 60 * 1000) {
      spins = Math.max(spins, 3);
      localStorage.setItem('tma_spins', spins);
      localStorage.setItem('tma_last_reset', now.toString());
    }

    const boardEl = document.getElementById('board');
    const spinCountEl = document.getElementById('spin-count');
    const levelTitleEl = document.getElementById('level-title');
    const progressFillEl = document.getElementById('progress-fill');
    const btnAction = document.getElementById('btn-action');
    const modal = document.getElementById('reveal-modal');
    const revealImg = document.getElementById('reveal-img');
    const revealTitle = document.getElementById('reveal-title');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function saveState() {
      localStorage.setItem('tma_level_idx', currentLevelIndex);
      localStorage.setItem('tma_spins', spins);
      localStorage.setItem('tma_unlocked_ids', JSON.stringify(Array.from(unlockedTileIds)));
    }

    function renderBoard() {
      const activeLevel = gameLevels[currentLevelIndex];
      levelTitleEl.textContent = activeLevel.theme;
      boardEl.innerHTML = '';

      let levelUnlockedCount = 0;

      activeLevel.tiles.forEach((tile, index) => {
        const isUnlocked = unlockedTileIds.has(tile.id);
        if (isUnlocked) levelUnlockedCount++;

        const div = document.createElement('div');
        div.className = `tile ${isUnlocked ? 'unlocked' : ''}`;
        div.id = `tile-${index}`;
        div.innerHTML = `<img src="${tile.url}" alt="${tile.title}" />`;
        boardEl.appendChild(div);
      });

      // Update progress bar
      const progressPercent = (levelUnlockedCount / activeLevel.tiles.length) * 100;
      progressFillEl.style.width = `${progressPercent}%`;

      // Check level completion
      if (levelUnlockedCount === activeLevel.tiles.length && currentLevelIndex < gameLevels.length - 1) {
        currentLevelIndex++;
        saveState();
        setTimeout(() => {
          alert(`🎉 Level Cleared! Welcome to ${gameLevels[currentLevelIndex].theme}!`);
          renderBoard();
        }, 500);
      }
    }

    function updateControls() {
      spinCountEl.textContent = spins;
      if (spins > 0) {
        btnAction.className = 'btn btn-spin';
        btnAction.textContent = `SPIN (Remaining: ${spins})`;
      } else {
        btnAction.className = 'btn btn-ad';
        btnAction.textContent = 'Watch Ad to get +1 Spin';
      }
    }

    btnAction.addEventListener('click', () => {
      if (isSpinning) return;
      if (spins > 0) {
        runTileSpin();
      } else {
        triggerSimulatedAd();
      }
    });

    function runTileSpin() {
      const activeTiles = gameLevels[currentLevelIndex].tiles;
      isSpinning = true;
      spins--;
      saveState();
      updateControls();

      let currentIndex = 0;
      let speed = 60;
      let totalSteps = 20 + Math.floor(Math.random() * 8);
      let step = 0;

      function highlightStep() {
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('active-highlight'));
        const activeTileEl = document.getElementById(`tile-${currentIndex % activeTiles.length}`);
        if (activeTileEl) activeTileEl.classList.add('active-highlight');

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        step++;
        currentIndex++;

        if (step < totalSteps) {
          if (step > totalSteps - 6) speed += 35;
          setTimeout(highlightStep, speed);
        } else {
          finishSpin(currentIndex % activeTiles.length);
        }
      }

      highlightStep();
    }

    function finishSpin(landedIndex) {
      isSpinning = false;
      const wonTile = gameLevels[currentLevelIndex].tiles[landedIndex];
      unlockedTileIds.add(wonTile.id);
      saveState();
      renderBoard();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      revealTitle.textContent = `Unlocked: ${wonTile.title}`;
      revealImg.src = wonTile.url;
      modal.classList.add('active');
      updateControls();
    }

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function triggerSimulatedAd() {
      alert("Watching simulated ad...");
      setTimeout(() => {
        spins += 1;
        saveState();
        updateControls();
        alert("+1 Spin added!");
      }, 1000);
    }

    renderBoard();
    updateControls();
  </script>
</body>
</html>
