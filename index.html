<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium File Locker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .8; transform: scale(0.98); }
        }
        
        /* Modal transition styles */
        .modal-enter { opacity: 0; pointer-events: none; }
        .modal-enter-active { opacity: 1; pointer-events: auto; transition: opacity 300ms ease-out; }
        .modal-exit { opacity: 1; }
        .modal-exit-active { opacity: 0; pointer-events: none; transition: opacity 300ms ease-in; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative overflow-hidden transition-all duration-500" id="main-card">
        <!-- Decoration -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
        
        <div class="text-center">
            <!-- Icon Container -->
            <div id="icon-container" class="mx-auto w-24 h-24 bg-gray-100 rounded-2xl flex items-center justify-center mb-6 transition-colors duration-300">
                <!-- Locked SVG -->
                <svg id="icon-locked" class="w-12 h-12 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <!-- Unlocked SVG (Hidden initially) -->
                <svg id="icon-unlocked" class="w-12 h-12 text-green-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                </svg>
            </div>

            <!-- File Info -->
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Premium_Assets_Pack.zip</h1>
            <div class="flex items-center justify-center space-x-2 text-sm text-gray-500 mb-8">
                <span class="flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                    145 MB
                </span>
                <span>•</span>
                <span id="status-text" class="font-medium text-red-500 bg-red-50 px-2 py-0.5 rounded">Locked</span>
            </div>

            <!-- Actions -->
            <div id="action-container" class="space-y-4">
                <button id="btn-unlock" class="w-full relative group overflow-hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center pulse-soft">
                    <div class="absolute inset-0 shimmer"></div>
                    <svg class="w-5 h-5 mr-2 relative z-10" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    <span class="relative z-10">Watch Ad to Unlock</span>
                </button>
                <p class="text-xs text-gray-400">Support the creator by watching a short sponsor video.</p>
            </div>

            <!-- Download Container (Hidden initially) -->
            <div id="download-container" class="hidden space-y-4">
                <button id="btn-download" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center transform hover:-translate-y-1">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download File
                </button>
                <p class="text-xs text-green-600 font-medium bg-green-50 py-2 rounded-lg">File successfully unlocked!</p>
            </div>
        </div>
    </div>

    <!-- Simulated Ad Modal -->
    <div id="ad-modal" class="fixed inset-0 bg-gray-900/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center modal-enter">
        <div class="w-full max-w-2xl px-4 flex flex-col h-full md:h-auto md:max-h-[80vh] justify-center">
            
            <!-- Ad Header -->
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-400 text-sm font-medium tracking-wider uppercase">Advertisement</span>
                <div class="bg-gray-800 text-white px-4 py-1.5 rounded-full text-sm font-bold flex items-center shadow-inner">
                    <svg class="w-4 h-4 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Reward in: <span id="countdown-timer" class="ml-1 w-4 text-center">10</span>s
                </div>
            </div>

            <!-- Ad Content (Simulated Video) -->
            <div class="bg-black aspect-video rounded-xl overflow-hidden relative shadow-2xl border border-gray-800 flex items-center justify-center group">
                <!-- Abstract Ad Placeholder Graphic -->
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-purple-900 to-black opacity-80"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10">
                    <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mb-4 backdrop-blur-md border border-white/20 pulse-soft">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Supercharge Your Workflow</h2>
                    <p class="text-gray-300 max-w-md">Try our new AI-powered developer tools today. Build faster, smarter, and better.</p>
                </div>
                <!-- Fake progress bar -->
                <div class="absolute bottom-0 left-0 h-1 bg-gray-800 w-full">
                    <div id="ad-progress" class="h-full bg-indigo-500 w-0 transition-all duration-1000 ease-linear"></div>
                </div>
            </div>

            <!-- Ad Footer / Actions -->
            <div class="mt-6 flex justify-end">
                <button id="btn-skip" disabled class="bg-gray-700 text-gray-400 font-medium py-2.5 px-6 rounded-lg cursor-not-allowed transition-colors duration-300 flex items-center">
                    Please Wait...
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const btnUnlock = document.getElementById('btn-unlock');
            const btnDownload = document.getElementById('btn-download');
            const btnSkip = document.getElementById('btn-skip');
            const adModal = document.getElementById('ad-modal');
            const countdownTimer = document.getElementById('countdown-timer');
            const adProgress = document.getElementById('ad-progress');
            
            const actionContainer = document.getElementById('action-container');
            const downloadContainer = document.getElementById('download-container');
            const iconLocked = document.getElementById('icon-locked');
            const iconUnlocked = document.getElementById('icon-unlocked');
            const iconContainer = document.getElementById('icon-container');
            const statusText = document.getElementById('status-text');

            // Config
            const AD_DURATION = 10; // seconds
            let currentTimer = AD_DURATION;
            let timerInterval;

            // Start Ad Flow
            btnUnlock.addEventListener('click', () => {
                // Reset timer
                currentTimer = AD_DURATION;
                countdownTimer.textContent = currentTimer;
                adProgress.style.width = '0%';
                
                // Show modal
                adModal.classList.remove('modal-enter', 'modal-exit-active');
                adModal.classList.add('modal-enter-active');
                
                // Reset skip button
                btnSkip.disabled = true;
                btnSkip.classList.add('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                btnSkip.classList.remove('bg-white', 'text-gray-900', 'hover:bg-gray-100', 'cursor-pointer');
                btnSkip.innerHTML = 'Please Wait...';

                // Start countdown
                setTimeout(() => {
                    // Start progress bar animation
                    adProgress.style.width = '100%';
                    adProgress.style.transitionDuration = `${AD_DURATION}s`;

                    timerInterval = setInterval(() => {
                        currentTimer--;
                        countdownTimer.textContent = currentTimer;

                        if (currentTimer <= 0) {
                            clearInterval(timerInterval);
                            adFinished();
                        }
                    }, 1000);
                }, 100); // slight delay to ensure transition applies
            });

            // When Ad Finishes
            function adFinished() {
                countdownTimer.textContent = '0';
                
                // Enable skip/close button
                btnSkip.disabled = false;
                btnSkip.classList.remove('bg-gray-700', 'text-gray-400', 'cursor-not-allowed');
                btnSkip.classList.add('bg-white', 'text-gray-900', 'hover:bg-gray-100', 'cursor-pointer');
                btnSkip.innerHTML = 'Continue to File <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
            }

            // Close Ad Modal & Unlock File
            btnSkip.addEventListener('click', () => {
                if(btnSkip.disabled) return;

                // Hide Modal
                adModal.classList.remove('modal-enter-active');
                adModal.classList.add('modal-exit-active');
                
                setTimeout(() => {
                    adModal.classList.add('modal-enter'); // reset for future if needed
                }, 300);

                // Update Main UI to Unlocked State
                unlockFileUI();
            });

            function unlockFileUI() {
                // Hide unlock button, show download button
                actionContainer.classList.add('hidden');
                downloadContainer.classList.remove('hidden');

                // Update Icons
                iconLocked.classList.add('hidden');
                iconUnlocked.classList.remove('hidden');
                iconContainer.classList.remove('bg-gray-100');
                iconContainer.classList.add('bg-green-50');

                // Update Status
                statusText.textContent = 'Unlocked';
                statusText.classList.remove('text-red-500', 'bg-red-50');
                statusText.classList.add('text-green-600', 'bg-green-100');
            }

            // Dummy File Download
            btnDownload.addEventListener('click', () => {
                // Create a minimal valid empty zip file in base64 to simulate real download
                // "UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==" represents an empty ZIP file
                const zipBase64 = "UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==";
                const byteCharacters = atob(zipBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], {type: "application/zip"});
                
                // Create object URL and trigger download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Premium_Assets_Pack.zip';
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                // Visual feedback on button
                const originalText = btnDownload.innerHTML;
                btnDownload.innerHTML = '<svg class="w-5 h-5 mr-2 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Downloading...';
                
                setTimeout(() => {
                    btnDownload.innerHTML = originalText;
                }, 2000);
            });
        });
    </script>
</body>
</html>
