  <style>
    :root {
      --bg: #0f1015;
      --card: #1b1c24;
      --accent: #ff4757;
      --text: #ffffff;
      --gold: #ffd32a;
      --dim: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .browser-notice {
      background: #181922;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
    }

    .top-bar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .spins-badge { background: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }

    .banner-ad-container {
      width: 100%;
      max-width: 380px;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      background: #15161e;
      border-radius: 10px;
      overflow: hidden;
    }

    .level-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .level-tab {
      background: #23252f;
      color: var(--dim);
      border: 1px solid #333;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .level-tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .level-tab.locked { opacity: 0.35; cursor: not-allowed; }

    .tile-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 12px;
      padding: 2px;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #181922;
      transition: transform 0.1s, border-color 0.1s;
    }

    .tile.is-locked {
      border: 2px dashed #2f3342;
    }
    .tile.is-locked .lock-icon {
      font-size: 1.5rem;
      color: #555b70;
    }

    .tile.is-unlocked {
      background: var(--card);
      border: 2px solid #2ed573;
    }
    .tile.is-unlocked img, 
    .tile.is-unlocked video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .tile-tag {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 5px;
      border-radius: 6px;
      font-weight: bold;
      z-index: 2;
    }

    .tile.active-highlight {
      border-color: var(--gold) !important;
      transform: scale(1.06);
      box-shadow: 0 0 16px var(--gold);
      z-index: 3;
    }

    .btn-group {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-spin { background: #2ed573; color: #000; }
    .btn-ad { background: #ffa502; color: #000; }
    .btn-vault { background: #3742fa; color: #fff; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 100;

    function loadStorage(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    let selectedLevel = loadStorage("quest_selected_lvl", 0);
    let maxUnlockedLevel = loadStorage("quest_max_lvl", 0);
    let spins = loadStorage("quest_spins", 3);
    let unlockedIds = new Set(loadStorage("quest_unlocked_ids", []));
    let isSpinning = false;

    let activeAlbum = null;
    let albumIndex = 0;

    const boardEl = document.getElementById('board');
    const levelTabsEl = document.getElementById('level-tabs');
    const spinCountEl = document.getElementById('spin-count');
    const vaultCountEl = document.getElementById('vault-count');
    const btnAction = document.getElementById('btn-action');
    const btnWatchAd = document.getElementById('btn-watch-ad');
    const btnOpenVault = document.getElementById('btn-open-vault');

    const modal = document.getElementById('media-modal');
    const modalTitle = document.getElementById('modal-title');
    const mediaContainer = document.getElementById('media-container');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const albumNav = document.getElementById('album-nav');
    const albumCounter = document.getElementById('album-counter');
    const albumPrev = document.getElementById('album-prev');
    const albumNext = document.getElementById('album-next');

    const vaultModal = document.getElementById('vault-modal');
    const vaultGrid = document.getElementById('vault-grid');
    const vaultCloseBtn = document.getElementById('vault-close-btn');

    function saveGameState() {
      saveStorage("quest_selected_lvl", selectedLevel);
      saveStorage("quest_max_lvl", maxUnlockedLevel);
      saveStorage("quest_spins", spins);
      saveStorage("quest_unlocked_ids", Array.from(unlockedIds));
    }

    function renderLevelTabs() {
      levelTabsEl.innerHTML = '';
      gameLevels.forEach((lvl, idx) => {
        const tab = document.createElement('div');
        const isUnlocked = idx <= maxUnlockedLevel;
        tab.className = `level-tab ${idx === selectedLevel ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
        tab.textContent = isUnlocked ? lvl.name : `🔒 ${lvl.name}`;
        tab.addEventListener('click', () => {
          if (isUnlocked && !isSpinning) {
            selectedLevel = idx;
            saveGameState();
            renderLevelTabs();
            renderBoard();
          }
        });
        levelTabsEl.appendChild(tab);
      });
    }

    function renderBoard() {
      const activeLvl = gameLevels[selectedLevel];
      boardEl.innerHTML = '';

      activeLvl.tiles.forEach((tile, index) => {
        const isUnlocked = unlockedIds.has(tile.id);
        const div = document.createElement('div');
        div.className = `tile ${isUnlocked ? 'is-unlocked' : 'is-locked'}`;
        div.id = `tile-${index}`;
        
        if (isUnlocked) {
          if (tile.type === 'album') {
            const firstItem = tile.items[0];
            const preview = firstItem.type === 'video'
              ? `<video src="${firstItem.url}#t=0.5" preload="metadata" muted playsinline></video>`
              : `<img src="${firstItem.url}" alt="Album" loading="lazy" />`;
            div.innerHTML = `${preview}<div class="tile-tag">📚 ${tile.items.length}</div>`;
          } else if (tile.type === 'video') {
            div.innerHTML = `<video src="${tile.url}#t=0.5" preload="metadata" muted playsinline></video><div class="tile-tag">🎬</div>`;
          } else {
            div.innerHTML = `<img src="${tile.url}" alt="Unlocked" loading="lazy" />`;
          }
          div.addEventListener('click', () => {
            if (!isSpinning) openMediaViewer(tile);
          });
        } else {
          div.innerHTML = `<span class="lock-icon">🔒</span>`;
        }

        boardEl.appendChild(div);
      });
    }

    function updateControls() {
      spinCountEl.textContent = spins;
      vaultCountEl.textContent = unlockedIds.size;
      if (spins > 0) {
        btnAction.className = 'btn btn-spin';
        btnAction.textContent = `SPIN TILES (${spins} Left)`;
      } else {
        btnAction.className = 'btn btn-ad';
        btnAction.textContent = '⚡ Out of Spins - Get +3 Spins';
      }
    }

    // Rewarded Action: Grants +3 Spins while Popunder handles ad view in the background
    function handleRewardAction() {
      spins += 3;
      saveGameState();
      updateControls();

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }

    btnAction.addEventListener('click', () => {
      if (isSpinning) return;
      if (spins > 0) {
        runTileSpin();
      } else {
        handleRewardAction();
      }
    });

    btnWatchAd.addEventListener('click', () => {
      if (!isSpinning) handleRewardAction();
    });

    btnOpenVault.addEventListener('click', () => {
      renderVaultGrid();
      vaultModal.classList.add('active');
    });

    vaultCloseBtn.addEventListener('click', () => {
      vaultModal.classList.remove('active');
    });

    function runTileSpin() {
      const activeTiles = gameLevels[selectedLevel].tiles;
      const lockedIndices = [];

      activeTiles.forEach((tile, idx) => {
        if (!unlockedIds.has(tile.id)) lockedIndices.push(idx);
      });

      let targetIndex;
      if (lockedIndices.length > 0) {
        targetIndex = lockedIndices[Math.floor(Math.random() * lockedIndices.length)];
      } else {
        targetIndex = Math.floor(Math.random() * activeTiles.length);
      }

      isSpinning = true;
      spins--;
      saveGameState();
      updateControls();

      let currentIndex = 0;
      let speed = 40;
      const numTiles = activeTiles.length;
      const totalSteps = (2 * numTiles) + targetIndex;
      let step = 0;

      function stepAnimation() {
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('active-highlight'));
        const activeEl = document.getElementById(`tile-${currentIndex % numTiles}`);
        if (activeEl) {
          activeEl.classList.add('active-highlight');
        }

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        step++;
        currentIndex++;

        if (step <= totalSteps) {
          if (step > totalSteps - 6) speed += 40;
          setTimeout(stepAnimation, speed);
        } else {
          finishSpin(targetIndex);
        }
      }

      stepAnimation();
    }

    function finishSpin(landedIndex) {
      isSpinning = false;
      const wonTile = gameLevels[selectedLevel].tiles[landedIndex];
      unlockedIds.add(wonTile.id);

      const allCurrentUnlocked = gameLevels[selectedLevel].tiles.every(t => unlockedIds.has(t.id));
      if (allCurrentUnlocked && selectedLevel === maxUnlockedLevel && maxUnlockedLevel < gameLevels.length - 1) {
        maxUnlockedLevel++;
      }

      saveGameState();
      renderLevelTabs();
      renderBoard();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      openMediaViewer(wonTile);
      updateControls();
    }

    function openMediaViewer(tile) {
      if (tile.type === 'album') {
        activeAlbum = tile.items;
        albumIndex = 0;
        modalTitle.textContent = `📚 ${tile.name || 'Unlocked Album'}`;
        albumNav.style.display = 'flex';
        renderAlbumItem();
      } else {
        activeAlbum = null;
        albumNav.style.display = 'none';
        modalTitle.textContent = tile.type === 'video' ? '🎬 Video Unlocked' : '📸 Photo Unlocked';
        renderSingleMedia(tile.type, tile.url);
      }

      modal.classList.add('active');
    }

    function renderSingleMedia(type, url) {
      mediaContainer.innerHTML = '';
      if (type === 'video') {
        mediaContainer.innerHTML = `<video src="${url}" controls autoplay loop playsinline></video>`;
      } else {
        mediaContainer.innerHTML = `<img src="${url}" alt="Unlocked Media" />`;
      }
    }

    function renderAlbumItem() {
      if (!activeAlbum || activeAlbum.length === 0) return;
      const current = activeAlbum[albumIndex];
      albumCounter.textContent = `${albumIndex + 1} / ${activeAlbum.length}`;
      renderSingleMedia(current.type, current.url);
    }

    albumPrev.addEventListener('click', () => {
      if (!activeAlbum) return;
      albumIndex = (albumIndex - 1 + activeAlbum.length) % activeAlbum.length;
      renderAlbumItem();
    });

    albumNext.addEventListener('click', () => {
      if (!activeAlbum) return;
      albumIndex = (albumIndex + 1) % activeAlbum.length;
      renderAlbumItem();
    });

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      mediaContainer.innerHTML = '';
      activeAlbum = null;
    });

    function renderVaultGrid() {
      vaultGrid.innerHTML = '';
      let totalFound = 0;

      gameLevels.forEach(lvl => {
        lvl.tiles.forEach(tile => {
          if (unlockedIds.has(tile.id)) {
            totalFound++;
            const div = document.createElement('div');
            div.className = 'vault-item';

            if (tile.type === 'album') {
              const first = tile.items[0];
              const tag = `<div class="tile-tag">📚 ${tile.items.length}</div>`;
              div.innerHTML = first.type === 'video'
                ? `<video src="${first.url}#t=0.5" preload="metadata" muted playsinline></video>${tag}`
                : `<img src="${first.url}" alt="Vault Album" loading="lazy" />${tag}`;
            } else if (tile.type === 'video') {
              div.innerHTML = `<video src="${tile.url}#t=0.5" preload="metadata" muted playsinline></video><div class="tile-tag">🎬</div>`;
            } else {
              div.innerHTML = `<img src="${tile.url}" alt="Vault Item" loading="lazy" />`;
            }

            div.addEventListener('click', () => {
              vaultModal.classList.remove('active');
              openMediaViewer(tile);
            });

            vaultGrid.appendChild(div);
          }
        });
      });

      if (totalFound === 0) {
        vaultGrid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: #777; padding: 24px 0;">No unlocked media yet. Spin the tiles to unlock!</p>';
      }
    }

    renderLevelTabs();
    renderBoard();
    updateControls();

    try {
      (window.AdProvider = window.AdProvider || []).push({ "serve": {} });
    } catch (e) {}
  </script>
</body>
</html>
