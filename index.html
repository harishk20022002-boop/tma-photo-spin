<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Photo Spin Quest</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>

  <!-- ExoClick Site Verification -->
  <meta name="6a97888e-site-verification" content="09827d4f030fe971425d121c18ba2745">

  <style>
    :root {
      --bg: #0f1015;
      --card: #1b1c24;
      --accent: #ff4757;
      --text: #ffffff;
      --gold: #ffd32a;
      --dim: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .browser-notice {
      background: #181922;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
    }

    .top-bar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .spins-badge { background: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }

    /* Static Banner Ad Containers */
    .banner-ad-container {
      width: 100%;
      max-width: 380px;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      background: #15161e;
      border-radius: 10px;
      overflow: hidden;
    }

    .level-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .level-tab {
      background: #23252f;
      color: var(--dim);
      border: 1px solid #333;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .level-tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .level-tab.locked { opacity: 0.35; cursor: not-allowed; }

    .tile-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 12px;
      max-height: 48vh;
      overflow-y: auto;
      padding: 4px;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }

    .tile.is-locked {
      background: #181922;
      border: 2px dashed #2f3342;
    }
    .tile.is-locked .lock-icon {
      font-size: 1.6rem;
      color: #555b70;
    }

    .tile.is-unlocked {
      background: var(--card);
      border: 2px solid #2ed573;
    }
    .tile.is-unlocked img, .tile.is-unlocked video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-tag {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: bold;
    }

    .tile.active-highlight {
      border-color: var(--gold) !important;
      transform: scale(1.06);
      box-shadow: 0 0 16px var(--gold);
      z-index: 2;
    }

    .btn-group {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-spin { background: #2ed573; color: #000; }
    .btn-ad { background: #ffa502; color: #000; }

    /* Media Viewer Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    
    .media-container {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 4/5;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1px solid #444;
    }
    .media-container img, .media-container video { width: 100%; height: 100%; object-fit: contain; }

    .modal-close { background: #fff; color: #000; padding: 10px 24px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; }

    /* ExoClick Ad Overlay */
    #ad-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #ad-overlay.active { display: flex; }
    
    .ad-box {
      width: 300px;
      min-height: 250px;
      background: #181922;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #333;
    }
    
    .ad-claim-btn {
      background: #2ed573;
      color: #000;
      padding: 12px 28px;
      border-radius: 20px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .ad-claim-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="browser-notice">
    <h4 style="color: var(--gold); margin-bottom: 4px;">Photo Spin Quest</h4>
    <p>Daily lucky spin game to unlock exclusive galleries & clips.</p>
  </div>

  <div class="top-bar">
    <div style="font-weight: bold; font-size: 1.1rem;">Spin Quest</div>
    <div class="spins-badge">Spins: <span id="spin-count">3</span></div>
  </div>

  <div class="level-tabs" id="level-tabs"></div>

  <!-- Top Banner Ad (Above the Tiles) -->
  <div class="banner-ad-container">
    <ins class="eas6a97888e2" data-zoneid="6014424"></ins>
  </div>

  <!-- The Tile Board -->
  <div class="tile-board" id="board"></div>

  <!-- Action Buttons -->
  <div class="btn-group">
    <button id="btn-action" class="btn btn-spin">SPIN THE TILES</button>
    <button id="btn-watch-ad" class="btn btn-ad">📺 Watch Ad (+1 Spin)</button>
  </div>

  <!-- Bottom Banner Ad (Below the Tiles / Buttons) -->
  <div class="banner-ad-container">
    <ins class="eas6a97888e2" data-zoneid="6014424"></ins>
  </div>

  <!-- Media Viewer Modal -->
  <div class="modal" id="media-modal">
    <h3 id="modal-title" style="margin-bottom: 8px;">Item Unlocked</h3>
    <div class="media-container" id="media-container"></div>
    <button class="modal-close" id="modal-close-btn">Collect & Continue</button>
  </div>

  <!-- 10-Second Ad Modal Overlay -->
  <div id="ad-overlay">
    <div style="font-size: 0.95rem; color: var(--gold); margin-bottom: 12px; font-weight: bold;">Sponsored Ad Reward</div>
    <div class="ad-box" id="exoclick-slot"></div>
    <button class="ad-claim-btn" id="ad-claim-btn" disabled>Watch ad (10s)</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const gameLevels = [
      {

          { id: 101, type: "image", url: "https://files.catbox.moe/jvww0b.jpg" },
          { id: 102, type: "video", url: "https://files.catbox.moe/8ky9qz.mp4" },

        ]

        tiles: [
          { id: 201, type: "video", url: "https://files.catbox.moe/5ta2r8.mp4" },
          { id: 202, type: "image", url: "https://files.catbox.moe/fgqyul.jpg" },
          { id: 203, type: "image", url: "https://files.catbox.moe/6ye6pp.jpg" },

        ]

        tiles: [
          { id: 301, type: "video", url: "https://files.catbox.moe/z1eax0.mp4" },
          { id: 302, type: "video", url: "https://files.catbox.moe/grkzay.mp4" },
          { id: 303, type: "video", url: "https://files.catbox.moe/kmsdc7.mp4" },
          { id: 304, type: "image", url: "https://files.catbox.moe/b2oz3d.jpg" },
          { id: 305, type: "image", url: "https://files.catbox.moe/r6vpix.jpg" },

        ]

      {
        levelIndex: 3,
        name: "Lvl 4: Jagruthi",
        tiles: [
          { id: 401, type: "image", url: "https://files.catbox.moe/etvw1l.jpg" },
          { id: 402, type: "image", url: "https://files.catbox.moe/9nhsde.jpg" },
          { id: 403, type: "image", url: "https://files.catbox.moe/ix3ldu.jpg" },
          { id: 404, type: "image", url: "https://files.catbox.moe/sh6gli.jpg" },
          { id: 405, type: "image", url: "https://files.catbox.moe/1eyprc.jpg" },
          { id: 406, type: "video", url: "https://files.catbox.moe/msp6yu.mp4" },
          { id: 407, type: "image", url: "https://files.catbox.moe/7ctdm0.jpg" },
          { id: 408, type: "image", url: "https://files.catbox.moe/39uqd4.jpg" },
          { id: 409, type: "image", url: "https://files.catbox.moe/t1ek68.jpg" },
          { id: 410, type: "video", url: "https://files.catbox.moe/lvrb3i.mp4" },
          { id: 411, type: "video", url: "https://files.catbox.moe/iwta5q.mp4" },
          { id: 412, type: "image", url: "https://files.catbox.moe/hwaq33.jpg" },
          { id: 413, type: "image", url: "https://files.catbox.moe/2z1ojf.jpg" },
          { id: 414, type: "image", url: "https://files.catbox.moe/fb1iti.jpg" },
          { id: 415, type: "image", url: "https://files.catbox.moe/yaxc00.jpg" },
          { id: 416, type: "image", url: "https://files.catbox.moe/mlkbc3.jpg" },
          { id: 417, type: "image", url: "https://files.catbox.moe/l4rnkt.jpg" },
          { id: 418, type: "video", url: "https://files.catbox.moe/a2399d.mp4" },
          { id: 419, type: "video", url: "https://files.catbox.moe/zhvdvm.mp4" },
          { id: 420, type: "video", url: "https://files.catbox.moe/ei1lg4.mp4" },
          { id: 421, type: "video", url: "https://files.catbox.moe/0ssq9g.mp4" },
          { id: 422, type: "video", url: "https://files.catbox.moe/7qorxn.mp4" }
        ]
      }
    ];

    function loadStorage(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    let selectedLevel = loadStorage("quest_selected_lvl", 0);
    let maxUnlockedLevel = loadStorage("quest_max_lvl", 0);
    let spins = loadStorage("quest_spins", 3);
    let unlockedIds = new Set(loadStorage("quest_unlocked_ids", []));
    let isSpinning = false;
    let adInterval = null;

    const boardEl = document.getElementById('board');
    const levelTabsEl = document.getElementById('level-tabs');
    const spinCountEl = document.getElementById('spin-count');
    const btnAction = document.getElementById('btn-action');
    const btnWatchAd = document.getElementById('btn-watch-ad');

    const modal = document.getElementById('media-modal');
    const modalTitle = document.getElementById('modal-title');
    const mediaContainer = document.getElementById('media-container');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    const adOverlay = document.getElementById('ad-overlay');
    const adClaimBtn = document.getElementById('ad-claim-btn');
    const exoclickSlot = document.getElementById('exoclick-slot');

    function saveGameState() {
      saveStorage("quest_selected_lvl", selectedLevel);
      saveStorage("quest_max_lvl", maxUnlockedLevel);
      saveStorage("quest_spins", spins);
      saveStorage("quest_unlocked_ids", Array.from(unlockedIds));
    }

    function renderLevelTabs() {
      levelTabsEl.innerHTML = '';
      gameLevels.forEach((lvl, idx) => {
        const tab = document.createElement('div');
        const isUnlocked = idx <= maxUnlockedLevel;
        tab.className = `level-tab ${idx === selectedLevel ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
        tab.textContent = isUnlocked ? lvl.name : `🔒 ${lvl.name}`;
        tab.addEventListener('click', () => {
          if (isUnlocked && !isSpinning) {
            selectedLevel = idx;
            saveGameState();
            renderLevelTabs();
            renderBoard();
          }
        });
        levelTabsEl.appendChild(tab);
      });
    }

    function renderBoard() {
      const activeLvl = gameLevels[selectedLevel];
      boardEl.innerHTML = '';

      activeLvl.tiles.forEach((tile, index) => {
        const isUnlocked = unlockedIds.has(tile.id);
        const div = document.createElement('div');
        div.className = `tile ${isUnlocked ? 'is-unlocked' : 'is-locked'}`;
        div.id = `tile-${index}`;
        
        if (isUnlocked) {
          const videoBadge = tile.type === 'video' ? `<div class="video-tag">🎬 Video</div>` : '';
          if (tile.type === 'video') {
            div.innerHTML = `<video src="${tile.url}#t=0.5" preload="metadata" muted playsinline></video>${videoBadge}`;
          } else {
            div.innerHTML = `<img src="${tile.url}" alt="Unlocked" />`;
          }
          div.addEventListener('click', () => {
            if (!isSpinning) openMediaViewer(tile);
          });
        } else {
          div.innerHTML = `<span class="lock-icon">🔒</span>`;
        }

        boardEl.appendChild(div);
      });
    }

    function updateControls() {
      spinCountEl.textContent = spins;
      if (spins > 0) {
        btnAction.className = 'btn btn-spin';
        btnAction.textContent = `SPIN TILES (${spins} Left)`;
      } else {
        btnAction.className = 'btn btn-ad';
        btnAction.textContent = 'Out of Spins - Watch Ad';
      }
    }

    btnAction.addEventListener('click', () => {
      if (isSpinning) return;
      if (spins > 0) {
        runTileSpin();
      } else {
        showExoClickAd();
      }
    });

    btnWatchAd.addEventListener('click', () => {
      if (!isSpinning) showExoClickAd();
    });

    function runTileSpin() {
      const activeTiles = gameLevels[selectedLevel].tiles;
      const lockedIndices = [];

      activeTiles.forEach((tile, idx) => {
        if (!unlockedIds.has(tile.id)) lockedIndices.push(idx);
      });

      let targetIndex;
      if (lockedIndices.length > 0) {
        targetIndex = lockedIndices[Math.floor(Math.random() * lockedIndices.length)];
      } else {
        targetIndex = Math.floor(Math.random() * activeTiles.length);
      }

      isSpinning = true;
      spins--;
      saveGameState();
      updateControls();

      let currentIndex = 0;
      let speed = 40;
      const numTiles = activeTiles.length;
      const totalSteps = (2 * numTiles) + targetIndex;
      let step = 0;

      function stepAnimation() {
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('active-highlight'));
        const activeEl = document.getElementById(`tile-${currentIndex % numTiles}`);
        if (activeEl) {
          activeEl.classList.add('active-highlight');
          activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        step++;
        currentIndex++;

        if (step <= totalSteps) {
          if (step > totalSteps - 6) speed += 40;
          setTimeout(stepAnimation, speed);
        } else {
          finishSpin(targetIndex);
        }
      }

      stepAnimation();
    }

    function finishSpin(landedIndex) {
      isSpinning = false;
      const wonTile = gameLevels[selectedLevel].tiles[landedIndex];
      unlockedIds.add(wonTile.id);

      const allCurrentUnlocked = gameLevels[selectedLevel].tiles.every(t => unlockedIds.has(t.id));
      if (allCurrentUnlocked && selectedLevel === maxUnlockedLevel && maxUnlockedLevel < gameLevels.length - 1) {
        maxUnlockedLevel++;
      }

      saveGameState();
      renderLevelTabs();
      renderBoard();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      openMediaViewer(wonTile);
      updateControls();
    }

    function openMediaViewer(tile) {
      modalTitle.textContent = tile.type === 'video' ? '🎬 Video Unlocked' : '📸 Photo Unlocked';
      mediaContainer.innerHTML = '';

      if (tile.type === 'video') {
        mediaContainer.innerHTML = `<video src="${tile.url}" controls autoplay loop playsinline></video>`;
      } else {
        mediaContainer.innerHTML = `<img src="${tile.url}" alt="Unlocked" />`;
      }

      modal.classList.add('active');
    }

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      mediaContainer.innerHTML = '';
    });

    function showExoClickAd() {
      // Re-inject a clean ad slot into the overlay
      exoclickSlot.innerHTML = '<ins class="eas6a97888e2" data-zoneid="6014424"></ins>';

      adOverlay.classList.add('active');

      // Request impression from ExoClick
      try {
        (window.AdProvider = window.AdProvider || []).push({ "serve": {} });
      } catch (e) {}

      let countdown = 10;
      adClaimBtn.disabled = true;
      adClaimBtn.textContent = `Watch ad (${countdown}s)`;

      if (adInterval) clearInterval(adInterval);

      adInterval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          adClaimBtn.textContent = `Watch ad (${countdown}s)`;
        } else {
          clearInterval(adInterval);
          adClaimBtn.disabled = false;
          adClaimBtn.textContent = "Claim +1 Spin";
        }
      }, 1000);
    }

    adClaimBtn.addEventListener('click', () => {
      adOverlay.classList.remove('active');
      exoclickSlot.innerHTML = ''; // Clean up container
      spins += 1;
      saveGameState();
      updateControls();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    });

    // Initial Load
    renderLevelTabs();
    renderBoard();
    updateControls();

    // Trigger initial page-load banner ads
    try {
      (window.AdProvider = window.AdProvider || []).push({ "serve": {} });
    } catch (e) {}
  </script>
</body>
</html>
