<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Photo Spin Quest</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ExoClick Ad Provider SDK -->
  <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script>

  <style>
    :root {
      --bg: #0f1015;
      --card: #1b1c24;
      --accent: #ff4757;
      --text: #ffffff;
      --gold: #ffd32a;
      --dim: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .top-bar { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .spins-badge { background: var(--accent); padding: 6px 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }

    .level-tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .level-tab {
      background: #23252f;
      color: var(--dim);
      border: 1px solid #333;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .level-tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .level-tab.locked { opacity: 0.35; cursor: not-allowed; }

    .tile-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 16px;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }

    .tile.is-locked {
      background: #181922;
      border: 2px dashed #2f3342;
    }
    .tile.is-locked .lock-icon {
      font-size: 1.6rem;
      color: #555b70;
    }

    .tile.is-unlocked {
      background: var(--card);
      border: 2px solid #2ed573;
    }
    .tile.is-unlocked img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tile.active-highlight {
      border-color: var(--gold) !important;
      transform: scale(1.06);
      box-shadow: 0 0 16px var(--gold);
      z-index: 2;
    }

    .badge-count {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.8);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      max-width: 380px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .btn-spin { background: #2ed573; color: #000; }
    .btn-ad { background: #ffa502; color: #000; }

    .gallery-header { width: 100%; max-width: 380px; font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: var(--gold); display: flex; justify-content: space-between; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 30px;
      min-height: 80px;
    }

    .gallery-empty {
      grid-column: span 4;
      text-align: center;
      color: var(--dim);
      font-size: 0.85rem;
      padding: 20px 0;
      border: 1px dashed #2a2b36;
      border-radius: 8px;
    }

    .gallery-card {
      aspect-ratio: 1;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      cursor: pointer;
    }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }

    /* Media Viewer Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    
    .media-container {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 4/5;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid #444;
    }
    .media-container img, .media-container video { width: 100%; height: 100%; object-fit: contain; }

    .modal-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .nav-btn { background: #2f3542; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; }
    .modal-close { background: #fff; color: #000; padding: 10px 24px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; }

    /* ExoClick Ad Overlay */
    #ad-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #ad-overlay.active { display: flex; }
    
    .ad-box {
      width: 300px;
      min-height: 250px;
      background: #181922;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #333;
    }
    
    .ad-claim-btn {
      background: #2ed573;
      color: #000;
      padding: 12px 28px;
      border-radius: 20px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .ad-claim-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: bold; font-size: 1.1rem;">Photo Spin Quest</div>
    <div class="spins-badge">Spins: <span id="spin-count">3</span></div>
  </div>

  <div class="level-tabs" id="level-tabs"></div>
  <div class="tile-board" id="board"></div>

  <button id="btn-action" class="btn btn-spin">SPIN THE TILES</button>

  <div class="gallery-header">
    <span>My Unlocked Album</span>
    <span id="album-count">0 items</span>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>

  <!-- Media Viewer Modal -->
  <div class="modal" id="media-modal">
    <h3 id="modal-title" style="margin-bottom: 8px;">Photo Unlocked</h3>
    <div class="media-container" id="media-container"></div>
    <div class="modal-controls" id="media-nav" style="display: none;">
      <button class="nav-btn" id="prev-media">◀ Prev</button>
      <span id="media-counter" style="font-size: 0.85rem; color: #aaa;">1/1</span>
      <button class="nav-btn" id="next-media">Next ▶</button>
    </div>
    <button class="modal-close" id="modal-close-btn">Collect & Continue</button>
  </div>

  <!-- ExoClick Rewarded Overlay -->
  <div id="ad-overlay">
    <div style="font-size: 0.9rem; color: var(--gold); margin-bottom: 12px; font-weight: bold;">Sponsored Ad Reward</div>
    
    <div class="ad-box" id="exoclick-slot">
      <!-- ExoClick Zone Tag -->
      <ins class="eas6a97888e10" data-zoneid="6013872"></ins>
    </div>

    <button class="ad-claim-btn" id="ad-claim-btn" disabled>Claim +1 Spin (5s)</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch(e) {}

    // Multi-Level Configuration with Custom Media
    const gameLevels = [
      {
        levelIndex: 0,
        name: "Lvl 1: Desire",
        tiles: [
          {
            id: 101,
            title: "Amber Glow Pack",
            cover: "https://files.catbox.moe/yk9n5y.jpg",
            media: [
              { type: 'image', url: 'https://files.catbox.moe/yk9n5y.jpg' },
              { type: 'image', url: 'https://files.catbox.moe/b2oz3d.jpg' }
            ]
          },
          {
            id: 102,
            title: "Midnight Motion",
            cover: "https://files.catbox.moe/r6vpix.jpg",
            media: [
              { type: 'video', url: 'https://files.catbox.moe/z1eax0.mp4' },
              { type: 'image', url: 'https://files.catbox.moe/r6vpix.jpg' }
            ]
          },
          {
            id: 103,
            title: "Sunset Velvet",
            cover: "https://files.catbox.moe/wlwgdn.jpg",
            media: [
              { type: 'image', url: 'https://files.catbox.moe/wlwgdn.jpg' },
              { type: 'image', url: 'https://files.catbox.moe/93dbkg.jpg' }
            ]
          },
          {
            id: 104,
            title: "Neon Pulse Clip",
            cover: "https://files.catbox.moe/66q8wy.jpg",
            media: [
              { type: 'video', url: 'https://files.catbox.moe/kmsdc7.mp4' },
              { type: 'image', url: 'https://files.catbox.moe/66q8wy.jpg' }
            ]
          },
          {
            id: 105,
            title: "Silk & Shadow",
            cover: "https://files.catbox.moe/vi7mxf.jpg",
            media: [
              { type: 'image', url: 'https://files.catbox.moe/vi7mxf.jpg' },
              { type: 'image', url: 'https://files.catbox.moe/bf3npt.jpg' }
            ]
          },
          {
            id: 106,
            title: "VIP Reel & Portrait",
            cover: "https://files.catbox.moe/r8vik7.jpg",
            media: [
              { type: 'video', url: 'https://files.catbox.moe/grkzay.mp4' },
              { type: 'image', url: 'https://files.catbox.moe/r8vik7.jpg' }
            ]
          }
        ]
      },
      
    ];

    let selectedLevel = 0;
    let maxUnlockedLevel = 0;
    let spins = 3;
    let unlockedIds = new Set();
    let isSpinning = false;

    let activeMediaPack = [];
    let currentMediaIdx = 0;

    const boardEl = document.getElementById('board');
    const levelTabsEl = document.getElementById('level-tabs');
    const spinCountEl = document.getElementById('spin-count');
    const btnAction = document.getElementById('btn-action');
    const galleryGrid = document.getElementById('gallery-grid');
    const albumCount = document.getElementById('album-count');

    const modal = document.getElementById('media-modal');
    const modalTitle = document.getElementById('modal-title');
    const mediaContainer = document.getElementById('media-container');
    const mediaNav = document.getElementById('media-nav');
    const mediaCounter = document.getElementById('media-counter');
    const prevBtn = document.getElementById('prev-media');
    const nextBtn = document.getElementById('next-media');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    const adOverlay = document.getElementById('ad-overlay');
    const adClaimBtn = document.getElementById('ad-claim-btn');

    function renderLevelTabs() {
      levelTabsEl.innerHTML = '';
      gameLevels.forEach((lvl, idx) => {
        const tab = document.createElement('div');
        const isUnlocked = idx <= maxUnlockedLevel;
        tab.className = `level-tab ${idx === selectedLevel ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
        tab.textContent = isUnlocked ? lvl.name : `🔒 ${lvl.name}`;
        tab.addEventListener('click', () => {
          if (isUnlocked && !isSpinning) {
            selectedLevel = idx;
            renderLevelTabs();
            renderBoard();
          }
        });
        levelTabsEl.appendChild(tab);
      });
    }

    function renderBoard() {
      const activeLvl = gameLevels[selectedLevel];
      boardEl.innerHTML = '';

      activeLvl.tiles.forEach((tile, index) => {
        const isUnlocked = unlockedIds.has(tile.id);
        const div = document.createElement('div');
        div.className = `tile ${isUnlocked ? 'is-unlocked' : 'is-locked'}`;
        div.id = `tile-${index}`;
        
        if (isUnlocked) {
          const mediaCountBadge = tile.media.length > 1 ? `<div class="badge-count">1/${tile.media.length}</div>` : '';
          div.innerHTML = `<img src="${tile.cover}" alt="${tile.title}" />${mediaCountBadge}`;
          div.addEventListener('click', () => {
            if (!isSpinning) openMediaViewer(tile);
          });
        } else {
          div.innerHTML = `<span class="lock-icon">🔒</span>`;
        }

        boardEl.appendChild(div);
      });

      renderAlbum();
    }

    function renderAlbum() {
      galleryGrid.innerHTML = '';
      let totalUnlocked = 0;

      gameLevels.forEach(lvl => {
        lvl.tiles.forEach(tile => {
          if (unlockedIds.has(tile.id)) {
            totalUnlocked++;
            const card = document.createElement('div');
            card.className = 'gallery-card';
            card.innerHTML = `<img src="${tile.cover}" alt="${tile.title}" />`;
            card.addEventListener('click', () => openMediaViewer(tile));
            galleryGrid.appendChild(card);
          }
        });
      });

      if (totalUnlocked === 0) {
        galleryGrid.innerHTML = `<div class="gallery-empty">No photos unlocked yet. Spin above to reveal!</div>`;
      }

      albumCount.textContent = `${totalUnlocked} items`;
    }

    function updateControls() {
      spinCountEl.textContent = spins;
      if (spins > 0) {
        btnAction.className = 'btn btn-spin';
        btnAction.textContent = `SPIN (Remaining: ${spins})`;
      } else {
        btnAction.className = 'btn btn-ad';
        btnAction.textContent = 'Watch Ad to get +1 Spin';
      }
    }

    btnAction.addEventListener('click', () => {
      if (isSpinning) return;
      if (spins > 0) {
        runTileSpin();
      } else {
        showExoClickAd();
      }
    });

    function runTileSpin() {
      const activeTiles = gameLevels[selectedLevel].tiles;
      const lockedIndices = [];

      activeTiles.forEach((tile, idx) => {
        if (!unlockedIds.has(tile.id)) lockedIndices.push(idx);
      });

      let targetIndex;
      if (lockedIndices.length > 0) {
        targetIndex = lockedIndices[Math.floor(Math.random() * lockedIndices.length)];
      } else {
        targetIndex = Math.floor(Math.random() * activeTiles.length);
      }

      isSpinning = true;
      spins--;
      updateControls();

      let currentIndex = 0;
      let speed = 50;
      const numTiles = activeTiles.length;
      const totalSteps = (3 * numTiles) + targetIndex;
      let step = 0;

      function stepAnimation() {
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('active-highlight'));
        const activeEl = document.getElementById(`tile-${currentIndex % numTiles}`);
        if (activeEl) activeEl.classList.add('active-highlight');

        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        step++;
        currentIndex++;

        if (step <= totalSteps) {
          if (step > totalSteps - 6) speed += 40;
          setTimeout(stepAnimation, speed);
        } else {
          finishSpin(targetIndex);
        }
      }

      stepAnimation();
    }

    function finishSpin(landedIndex) {
      isSpinning = false;
      const wonTile = gameLevels[selectedLevel].tiles[landedIndex];
      unlockedIds.add(wonTile.id);

      const allCurrentUnlocked = gameLevels[selectedLevel].tiles.every(t => unlockedIds.has(t.id));
      if (allCurrentUnlocked && selectedLevel === maxUnlockedLevel && maxUnlockedLevel < gameLevels.length - 1) {
        maxUnlockedLevel++;
      }

      renderLevelTabs();
      renderBoard();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      openMediaViewer(wonTile);
      updateControls();
    }

    function openMediaViewer(tile) {
      activeMediaPack = tile.media;
      currentMediaIdx = 0;
      modalTitle.textContent = tile.title;
      renderCurrentMedia();
      modal.classList.add('active');
    }

    function renderCurrentMedia() {
      const item = activeMediaPack[currentMediaIdx];
      mediaContainer.innerHTML = '';

      if (item.type === 'video') {
        mediaContainer.innerHTML = `<video src="${item.url}" controls autoplay loop playsinline></video>`;
      } else {
        mediaContainer.innerHTML = `<img src="${item.url}" alt="Reward" />`;
      }

      if (activeMediaPack.length > 1) {
        mediaNav.style.display = 'flex';
        mediaCounter.textContent = `${currentMediaIdx + 1}/${activeMediaPack.length}`;
      } else {
        mediaNav.style.display = 'none';
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentMediaIdx > 0) {
        currentMediaIdx--;
        renderCurrentMedia();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentMediaIdx < activeMediaPack.length - 1) {
        currentMediaIdx++;
        renderCurrentMedia();
      }
    });

    modalCloseBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      mediaContainer.innerHTML = '';
    });

    function showExoClickAd() {
      adOverlay.classList.add('active');

      try {
        (window.AdProvider = window.AdProvider || []).push({ "serve": {} });
      } catch (e) {
        console.error("Ad provider error:", e);
      }

      let countdown = 5;
      adClaimBtn.disabled = true;
      adClaimBtn.textContent = `Claim +1 Spin (${countdown}s)`;

      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          adClaimBtn.textContent = `Claim +1 Spin (${countdown}s)`;
        } else {
          clearInterval(timer);
          adClaimBtn.disabled = false;
          adClaimBtn.textContent = "Collect +1 Spin";
        }
      }, 1000);
    }

    adClaimBtn.addEventListener('click', () => {
      adOverlay.classList.remove('active');
      spins += 1;
      updateControls();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    });

    renderLevelTabs();
    renderBoard();
    updateControls();
  </script>
</body>
</html>
